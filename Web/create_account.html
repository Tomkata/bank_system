    <header>
            <h1>Create Account Form</h1>
            <h3>Create bank account</h3>
    </header>
   <div class="form-account">
            <form id="createAccountForm">

            


                <div class="form-group">
                    <label for="owner_name">Owner Name:</label>
                    <input type="text" id="owner_name" name="owner_name"
                           placeholder="Enter the name of client" required>
                </div>

                <div class="form-group">
                    <label for="initial_amount">Initial Amount:</label>
                    <input type="number" id="initial_amount" name="initial_amount"
                           placeholder="Enter the initial amount" min="0" step="0.01" required>
                </div>

                <button type="submit" class="btn">Create Account</button>
            </form>
        </div>
    </div>
